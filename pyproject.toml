[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "blur-face-local"
version = "2.0.0"
description = "Privacy-oriented local video face blurring"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "imageio-ffmpeg>=0.6,<0.7",
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
blur-face = "blurface.app:main"

[tool.setuptools.packages.find]
include = ["blurface*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
